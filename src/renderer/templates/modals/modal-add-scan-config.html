<dialog id="add-game-modal">
  <div class="modal-form-container">

    <form id="scan-config-form">
      <div class="form-title">
        <h2>New ROMs Scan</h2>
      </div>
      <div class="form-content">


        <div class="form-group">
          <label>System Name</label>
          <input type="text" id="systemName" required>
        </div>

        <div class="form-group">
          <label>ROMs Folder:</label>
          <div class="path-selector">
            <input type="text" id="romsFolder" readonly required>
            <button type="button" class="btn btn-secondary" id="btn-browse-roms"><i class="bi bi-folder-fill"></i>
              Examine</button>
          </div>
        </div>

        <div class="form-group">
          <label>Command / Emulator Path</label>
          <div class="path-selector">
            <input type="text" id="emulatorPath" readonly required>
            <button class="btn btn-secondary" type="button" id="btn-browse-emulator"><i class="bi bi-folder-fill"></i>
              Examine</button>
          </div>
        </div>

        <div class="form-group">
          <label>Launch Arguments</label>
          <input type="text" id="launchArguments" placeholder='{gamePath} --fullscreen'>
          <small>Use <code>{gamePath}</code> to insert ROM path.</small>
        </div>
        <div class="form-group">
          <label>Extensions (comma separated)</label>
          <input type="text" id="extensions" placeholder=".iso,.bin,.cue,.chd">
        </div>

        <div class="form-group">
          <label>Categories</label>
          <select id="select-categories" multiple></select>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="enabled" checked>
            Enabled
          </label>
        </div>
      </div>
      <div class="form-buttons">
        <button class="btn btn-secondary" type="button" id="close-scan-modal">Cancel</button>
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>

</dialog>
