<dialog id="remove-game-modal">

    <div id="modal-loading" style="text-align:center; padding:2rem;">
        <div class="spinner"></div>
    </div>
    <div id="modal-form-container" class="modal-form-container" style="display:none;">
        <h2>Are you sure you want to remove this game?</h2>
        <form id="remove-game-form">
            <div class="form-content">
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="input-block-game">
                        Add to block list?
                    </label>
                </div>
            </div>

            <div class="form-group">
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" id="close-modal">Cancel</button>
                    <button type="submit" class="btn btn-danger">
                        <div class="btn-content">Remove</div>
                        <div class="btn-spinner display-none">
                            <span class="spinner-sm"></span>
                        </div>
                    </button>
                </div>
            </div>
        </form>
    </div>

</dialog>
