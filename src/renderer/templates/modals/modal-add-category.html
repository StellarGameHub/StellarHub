<dialog id="add-category-modal">
    <div id="modal-loading" style="text-align:center; padding:2rem;">
        <div class="spinner"></div>
    </div>
    <div id="modal-form-container" class="modal-form-container">

        <form id="categories-form">
            <div class="form-title">
                <h2>Game Categories</h2>
            </div>
            <div class="form-content">
                <template id="category-item-template">
                    <div class="modal-list-item">

                        <!-- Left group: Icon and Text -->
                        <div class="list-item-info">
                            <img class="list-item-icon" src="" alt="Category Icon">
                            <span class="list-item-name"></span>
                        </div>

                        <!-- Right group: Action Button -->
                        <button type="button" class="remove-item-btn" aria-label="Remove category">
                            <i class="bi bi-trash"></i>
                        </button>

                    </div>
                </template>

                <div id="categories-list" class="modal-list">


                </div>

                <h4>New Category</h2>

                    <div class="form-group">
                        <label>Name:</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group">
                        <label>Icon:</label>
                        <input type="file" id="iconFile" accept="image/png,image/jpeg,image/jpg,image/webp" required>
                    </div>




            </div>
            <div class="form-buttons">
                <button class="btn btn-secondary" type="button" id="close-modal">Cancel</button>
                <button class="btn btn-primary" type="submit">Save</button>
            </div>
        </form>
    </div>
</dialog>
