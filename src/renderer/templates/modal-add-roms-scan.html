<div class="modal-content">
  <form id="scan-config-form">
    <h2>Nuevo Escaneo de Roms</h2>
    <div class="form-group">
      <label>Nombre del sistema *</label>
      <input type="text" id="systemName" required>
    </div>

    <div class="form-group">
      <label>Carpeta de ROMs *</label>
      <div class="path-selector">
        <input type="text" id="romsFolder" readonly required>
        <button type="button" id="browseRomsFolder">📂 Examinar</button>
      </div>
    </div>

    <div class="form-group">
      <label>Ruta del emulador *</label>
      <div class="path-selector">
        <input type="text" id="emulatorPath" readonly required>
        <button type="button" id="browseEmulator">📁 Examinar</button>
      </div>
    </div>

    <div class="form-group">
      <label>Argumentos de lanzamiento</label>
      <input type="text" id="launchArguments" placeholder='{gamePath} --fullscreen'>
      <small>Usa <code>{gamePath}</code> para insertar la ruta de la ROM.</small>
    </div>
    <div class="form-group">
      <label>Extensiones (separadas por coma)</label>
      <input type="text" id="extensions" placeholder=".iso,.bin,.cue,.chd">
    </div>

    <div class="form-group">
      <label>Categorias</label>
      <select id="select-categories" multiple></select>
    </div>

    <div class="form-group">
      <label>Habilitado</label>
      <input type="checkbox" id="enabled" checked>
    </div>

    <div class="modal-buttons">
      <button type="submit">Guardar</button>
      <button type="button" id="close-scan-modal">Cancelar</button>
    </div>
  </form>
</div>
